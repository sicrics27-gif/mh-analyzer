name: 휴대폰 앱(PWA) 배포
on:   # 고칠 때마다 자동으로 돌지 않음 → '배포'(deploy.yml)가 대표님 "배포해" 또는 매일 03:47에 바뀐 것만 실행 (GitHub 사용 시간 절약)
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pwa
      - id: d
        uses: actions/deploy-pages@v4
