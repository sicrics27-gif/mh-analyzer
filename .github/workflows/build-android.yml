name: 안드로이드 앱(APK) 만들기 — AOB9
# 진짜 앱(크롬 없이 자체 화면) · 폴더 app-android/ · 같은 패키지·같은 서명 → 예전 앱 위에 '업데이트'로 설치됨
on:   # 고칠 때마다 자동으로 돌지 않음 → '배포'(deploy.yml)가 대표님 "배포해" 또는 매일 03:47에 바뀐 것만 실행 (GitHub 사용 시간 절약)
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 앱 부품 설치·연결
        working-directory: app-android
        run: |
          npm ci
          npx cap sync android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: 서명 열쇠 꺼내기 (금고에서)
        id: key
        env:
          OC9_KEY_PASS: ${{ secrets.OC9_KEY_PASS }}
          OC9_KEYSTORE_B64: ${{ secrets.OC9_KEYSTORE_B64 }}
        run: |
          if [ -z "$OC9_KEY_PASS" ] || [ -z "$OC9_KEYSTORE_B64" ]; then echo "::warning::금고(Secrets)에 OC9_KEYSTORE_B64 / OC9_KEY_PASS 가 아직 없어 APK를 만들지 않았습니다."; echo "ok=0" >> $GITHUB_OUTPUT; exit 0; fi
          echo "ok=1" >> $GITHUB_OUTPUT
          echo "$OC9_KEYSTORE_B64" | base64 -d > app-android/android/oc9.keystore
      - name: APK 빌드
        if: steps.key.outputs.ok == '1'
        working-directory: app-android/android
        env:
          OC9_KEY_PASS: ${{ secrets.OC9_KEY_PASS }}
          APP_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          mkdir -p ../../out
          cp app/build/outputs/apk/release/app-release.apk ../../out/AOB.apk
          cp app/build/outputs/bundle/release/app-release.aab ../../out/AOB-playstore.aab
          echo "{\"code\":${APP_CODE},\"native\":true}" > ../../out/apk.json
          FP=$(keytool -list -v -keystore oc9.keystore -storetype pkcs12 -storepass "$OC9_KEY_PASS" -alias oc9 2>/dev/null | grep -E "SHA1:" | head -1 | sed 's/.*SHA1: *//')
          echo "::notice title=SHA1::서명 지문 SHA1 ${FP:-없음}"
          rm -f oc9.keystore
      - if: steps.key.outputs.ok == '1'
        uses: actions/upload-artifact@v4
        with:
          name: AOB-android
          retention-days: 1   # 설치 파일은 릴리스에 따로 보관 → 여기 사본은 하루만 (GitHub 저장 용량 절약)
          path: out/*
      - name: 다운로드 주소에 올리기 (항상 같은 주소) — main 에서만
        if: steps.key.outputs.ok == '1' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: AOB9 안드로이드 앱
          body: "AOB9(어센틱 오션브랜치 9팀) 안드로이드 앱 (빌드 ${{ github.run_number }}) · 진짜 앱(크롬 없이). 휴대폰에서 AOB.apk 를 눌러 설치하세요. AOB-playstore.aab 는 구글 플레이 콘솔에 올리는 파일입니다."
          files: out/*
          make_latest: false
