name: 안드로이드 앱(APK) 만들기
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-android.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: 안드로이드 SDK 확인
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: 서명 열쇠 꺼내기 (금고에서)
        id: key
        env:
          OC9_KEY_PASS: ${{ secrets.OC9_KEY_PASS }}
          OC9_KEYSTORE_B64: ${{ secrets.OC9_KEYSTORE_B64 }}
        run: |
          if [ -z "$OC9_KEY_PASS" ] || [ -z "$OC9_KEYSTORE_B64" ]; then echo "::warning::금고(Secrets)에 OC9_KEYSTORE_B64 / OC9_KEY_PASS 가 아직 없어 APK를 만들지 않았습니다."; echo "ok=0" >> $GITHUB_OUTPUT; exit 0; fi
          echo "ok=1" >> $GITHUB_OUTPUT
          echo "$OC9_KEYSTORE_B64" | base64 -d > android/oc9.keystore
      - name: APK 빌드
        if: steps.key.outputs.ok == '1'
        working-directory: android
        env:
          OC9_KEY_PASS: ${{ secrets.OC9_KEY_PASS }}
          APP_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/AFG-OC9.apk
          echo "{\"code\":${APP_CODE}}" > ../out/apk.json
          rm -f oc9.keystore
      - if: steps.key.outputs.ok == '1'
        uses: actions/upload-artifact@v4
        with:
          name: AFG-OC9-android
          path: out/*
      - name: 다운로드 주소에 올리기 (항상 같은 주소)
        if: steps.key.outputs.ok == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: AFG OC9 안드로이드 앱
          body: "AFG OC9 안드로이드 앱 (빌드 ${{ github.run_number }}). 휴대폰에서 AFG-OC9.apk 를 눌러 설치하세요."
          files: out/*
          make_latest: false
