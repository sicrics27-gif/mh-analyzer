name: 윈도우 exe 만들기
on:
  push:
    branches: [main]
    paths-ignore: ['access.json', 'android/**', '.github/workflows/build-android.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Tauri CLI 설치
        run: cargo install tauri-cli --version "^2" --locked
      - name: exe 빌드
        working-directory: src-tauri
        env:
          GOOGLE_DESKTOP_SECRET: ${{ secrets.GOOGLE_DESKTOP_SECRET }}
          APP_BUILD: ${{ github.run_number }}
        run: cargo tauri build
      - name: 실행 파일 모으기
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/medical-history-analyzer.exe out/MH-Analyzer.exe
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1 | Copy-Item -Destination out/MH-Analyzer-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: AFG-OC9-windows
          path: out/*
      - name: 릴리스에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: AFG OC9 빌드 ${{ github.run_number }}
          files: out/*
