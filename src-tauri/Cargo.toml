[package]
name = "medical-history-analyzer"
version = "1.0.0"
description = "병력고지 분석기"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.2"
ureq = { version = "2", features = ["json"] }
arboard = { version = "3", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
