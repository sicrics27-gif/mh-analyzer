<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AOB9 · 어센틱 오션브랜치 9팀</title>
<meta name="theme-color" content="#090B10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-style:normal;font-display:swap;src:url(lib/PretendardVariable.woff2) format("woff2-variations")}</style><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>

/* 레이아웃: 위쪽 입력 패널 → 아래 리포트(요약 배지 → 3개월 → 5년 고지 카드 → 추가 상병 → 건강검진) 한 줄 흐름 */
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* 입력 패널 */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.brand span{color:var(--mute);font-size:13px}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:var(--soft);cursor:pointer;transition:border-color .15s}
.drop.on{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-size:15px}
.drop small{color:var(--mute);font-size:12.5px}
.files{display:flex;flex-wrap:wrap;gap:6px}
.fchip{font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper);display:inline-flex;gap:6px;align-items:center}
.fchip i{font-style:normal;color:var(--mute)}
.fchip.ok i{color:var(--green)} .fchip.bad{border-color:var(--red)} .fchip.bad i{color:var(--red)}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:.02em}
.field input,.field select{height:42px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--paper);width:100%}
.modes{display:flex;flex-wrap:wrap;gap:6px}
.mode{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:14px;font-weight:500}
.mode .mono{font-size:13.5px}
.mode[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.go{height:46px;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px;cursor:pointer}
.go:disabled{opacity:.5;cursor:default}
.note{font-size:12.5px;color:var(--mute)}
.err{color:var(--red);font-size:13.5px;white-space:pre-line}

/* 리포트 */
.report{display:flex;flex-direction:column;gap:18px}
.rhead{background:var(--accent);color:var(--on-accent);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:10px}
.rhead .eyebrow{font-size:12px;letter-spacing:.12em;opacity:.75}
.rhead h2{font-size:24px;font-weight:700}
.rmeta{display:flex;flex-wrap:wrap;gap:8px}
.rmeta div{background:color-mix(in srgb,var(--on-accent) 14%,transparent);border-radius:8px;padding:6px 12px;font-size:13px}
.rmeta b{font-weight:600;margin-left:6px}
.sample{display:inline-block;background:var(--amber-soft);color:var(--amber);font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px;align-self:flex-start}
.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.tl{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left}
.tl span{font-size:12.5px;color:var(--ink2)}
.tl b{font-size:24px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tl.hit b{color:var(--red)} .tl.zero b{color:var(--mute)}
.warnbox{border-radius:var(--r);padding:12px 14px;font-size:13.5px;line-height:1.7;background:var(--amber-soft);color:var(--ink)}
.warnbox b{color:var(--amber)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px}
.sec-h h3{font-size:17px;font-weight:700}
.sec-h span{font-size:12.5px;color:var(--mute)}
.empty{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;color:var(--ink2);font-size:14px}

.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 260px}
.dx .code{font-family:var(--f-mono);font-size:13px;color:var(--accent);font-weight:600}
.dx .name{font-size:16.5px;font-weight:700}
.dx .sub{font-size:13px;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--red-soft);color:var(--red)}
.chip.amb{background:var(--amber-soft);color:var(--amber)}
.tl.amb.hit b{color:var(--amber)}
.tally.small .tl{padding:8px 12px}.tally.small .tl b{font-size:18px}
table.ck td:first-child{white-space:nowrap;font-weight:600}
.ok{color:var(--green);font-weight:700}.no{color:var(--amber);font-weight:700}
.red{color:var(--red)}.amber{color:var(--amber)}
.why{color:var(--ink2)}
ol.qs{margin:0;padding:14px 16px 14px 34px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.qtag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:1px 6px;margin-right:6px}
.sumbar{display:flex;gap:8px;flex-wrap:wrap}.sumbar .go{flex:1 1 220px}
.chip.gr{background:var(--soft);color:var(--mute);font-weight:500}
.kv{display:grid;grid-template-columns:110px 1fr;font-size:14px}
.kv>div{padding:9px 16px;border-bottom:1px solid var(--line)}
.kv>div:nth-child(odd){color:var(--ink2);font-size:13px;background:var(--soft);padding-right:8px}
.kv>div:nth-last-child(-n+2){border-bottom:0}
.kv ul{margin:0;padding-left:16px}
.pill{display:inline-block;font-size:12px;padding:1px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-weight:600;margin-right:4px}
.acts{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap;background:var(--soft)}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 12px;font-size:13.5px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
details{font-size:13.5px}
details summary{cursor:pointer;color:var(--accent);font-weight:600}
details .inner{margin-top:6px;max-height:280px;overflow:auto;background:var(--soft);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.65}
.alert{font-size:13px;color:var(--amber);font-weight:600}

table.t{width:100%;min-width:640px;border-collapse:collapse;font-size:13.5px}
.tw{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px}
table.t th{background:var(--soft);font-weight:600;color:var(--ink2);text-align:left;padding:9px 12px;font-size:12.5px;white-space:nowrap}
table.t td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
table.t td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.v-red{color:var(--red);font-weight:700} .v-amb{color:var(--amber);font-weight:700}

.extra-row{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.extra-row:first-child{border-top:0}
.extra-row .mono{color:var(--accent);font-size:12.5px;margin-right:6px}
.extra-row small{color:var(--mute)}

.modal{position:fixed;inset:0;background:rgba(10,20,22,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mbox{background:var(--paper);border-radius:14px;width:min(600px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px;padding:18px}
.mbox h4{margin:0;font-size:16px}
.mbox p{margin:0;font-size:12.5px;color:var(--amber)}
.mbox textarea{width:100%;min-height:300px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--soft);font:13px/1.7 var(--f-body);resize:vertical}
.mrow{display:flex;gap:8px;justify-content:flex-end}
.foot{font-size:12px;color:var(--mute);line-height:1.8;text-align:center}
@media (max-width:560px){.kv{grid-template-columns:86px 1fr}.kv>div{padding:8px 10px}.rhead h2{font-size:20px}}

/* ===== 대시보드 레이아웃: PC는 왼쪽 입력 / 오른쪽 결과, 모바일은 위아래 ===== */
.wrap.app{max-width:1320px}
@media (min-width:1000px){
  .wrap.app{display:grid;grid-template-columns:360px minmax(0,1fr);align-items:start;gap:22px}
  .panel.side{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
  .panel.side .ctrls{grid-template-columns:1fr 1fr}
}
.mainc{display:flex;flex-direction:column;gap:18px;min-width:0}
.rhead h2 .crit{display:inline-block;font-size:14px;font-weight:600;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--on-accent) 18%,transparent);vertical-align:middle;margin-left:6px}
.actbar{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.actbar .go{flex:1 1 200px}
.actbar .btn{height:46px;padding:0 16px}
.btn:disabled{opacity:.45;cursor:default}
.tabs{display:flex;gap:4px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:transparent;padding:9px 14px;border-radius:999px;font-weight:600;font-size:14.5px;color:var(--ink2);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tab .cnt{font-family:var(--f-mono);font-size:12px;background:var(--soft);border:1px solid var(--line);color:var(--ink2);border-radius:999px;padding:0 7px;line-height:18px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab[aria-selected="true"] .cnt{background:transparent;border-color:color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg)}
.tab-disc .cnt{color:var(--red)}.tab-chk .cnt{color:var(--amber)}
.tabp{display:flex;flex-direction:column;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:14px 16px;text-align:left;cursor:pointer;display:grid;grid-template-columns:1fr auto;align-items:end;gap:2px 6px}
.kpi span{grid-column:1/-1;font-size:13px;font-weight:600;color:var(--ink2)}
.kpi b{font-size:34px;line-height:1.05;font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--mute)}
.kpi small{color:var(--mute);font-size:12px;align-self:end;padding-bottom:4px}
.kpi.red.on{border-color:color-mix(in srgb,var(--red) 45%,var(--line));background:var(--red-soft)}.kpi.red.on b{color:var(--red)}
.kpi.amber.on{border-color:color-mix(in srgb,var(--amber) 45%,var(--line));background:var(--amber-soft)}.kpi.amber.on b{color:var(--amber)}
.kpi.blue.on b{color:var(--accent)}
.minis{display:flex;flex-wrap:wrap;gap:6px}
.mini{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--mute)}
.mini b{font-family:var(--f-mono);margin-left:2px}
.mini.on{color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,var(--line))}
.briefs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.bgroup{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.bg-t{font-size:13px;font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line)}
.bg-t.red{color:var(--red)}.bg-t.amber{color:var(--amber)}.bg-t.blue{color:var(--accent)}
.brief{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 14px;cursor:pointer}
.brief:last-child{border-bottom:0}
.brief:hover{background:var(--soft)}
.brief .mono{color:var(--accent);font-size:12.5px}
.brief b{font-size:14.5px}
.brief .chips{flex-basis:100%}
.bgroup .empty{border:0;border-radius:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
/* ===== 질병예측 ===== */
.hp{display:flex;flex-direction:column;gap:14px}
.hp-top{display:flex;flex-direction:column;gap:14px}
.hp-years{display:flex;gap:6px;flex-wrap:wrap}
.hp-y{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:700;font-family:var(--f-mono);display:flex;flex-direction:column;align-items:center;line-height:1.2}
.hp-y small{font-weight:500;font-size:11px;color:var(--mute)}
.hp-y[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.hp-y[aria-pressed="true"] small{color:inherit;opacity:.8}
.hp-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:4px}
.hp-h h4{margin:0;font-size:16px}
.hp-h span{font-size:12.5px;color:var(--mute)}
.hp-organs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:760px){.hp-organs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.hp-organ{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0}
.hp-organ small{font-size:11.5px;color:var(--mute)}
.ring{width:84px;height:84px;max-width:100%}
.ring-bg{fill:none;stroke:var(--line);stroke-width:7}
.ring-fg{fill:none;stroke-width:7;stroke-linecap:round;stroke:var(--mute)}
.ring text{font:700 20px var(--f-mono);fill:var(--ink)}
.ring.t-g .ring-fg{stroke:var(--green)}.ring.t-a .ring-fg{stroke:var(--amber)}.ring.t-r .ring-fg{stroke:var(--red)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--mute)}
.tag.t-g{background:var(--green-soft);color:var(--green)}.tag.t-y{background:var(--green-soft);color:var(--green)}.tag.t-a{background:var(--amber-soft);color:var(--amber)}.tag.t-o{background:var(--red-soft);color:var(--red)}.tag.t-r{background:var(--red);color:var(--paper)}
.hp-risks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.hp-risk{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.hp-rt{display:flex;flex-direction:column}.hp-rt small{font-size:11.5px;color:var(--mute)}
.gauge{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.gauge i{height:8px;border-radius:3px;background:var(--line)}
.gauge i.on{background:var(--green)}
.gauge i.on.s5,.gauge i.on.s6{background:var(--amber)}
.gauge i.on.s7,.gauge i.on.s8{background:color-mix(in srgb,var(--red) 70%,var(--amber))}
.gauge i.on.s9,.gauge i.on.s10{background:var(--red)}
.gauge i.on.s3,.gauge i.on.s4{background:color-mix(in srgb,var(--green) 55%,var(--amber))}
.hp-rf{display:flex;justify-content:space-between;align-items:center}
.lvn{font:700 20px var(--f-mono)}.lvn small{font-size:12px;color:var(--mute)}
.hp-warns{display:flex;flex-direction:column;gap:10px}
.hp-warn{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
@media (max-width:700px){.hp-warn{grid-template-columns:1fr}}
.hp-wl{padding:14px 16px;display:flex;flex-direction:column;gap:3px;border-left:4px solid var(--amber)}
.hp-warn.lv2 .hp-wl{border-left-color:var(--red)}
.hp-wl b{font-size:15px}.hp-wl span{font-size:13.5px;color:var(--ink2)}
.hp-wr{padding:14px 16px;background:var(--soft);display:flex;flex-direction:column;gap:2px}
.hp-wr small{font-size:11.5px;font-weight:700;color:var(--mute);letter-spacing:.04em}
.hp-wr p{margin:0 0 6px;font-size:13.5px}
.hp-op{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.hp-op p{margin:0;font-size:14px}.hp-op p.hot{color:var(--red);font-weight:600}
.hp-op small{color:var(--mute);font-size:12px}
.hp-t td.dim{color:var(--mute)}
.hp-t em{font-style:normal;font-size:11px;margin-left:3px}.hp-t em.up{color:var(--red)}.hp-t em.dn{color:var(--green)}
.hp-t td small{font-size:11px;font-weight:600}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}


:root{
  --bg:#F2F4F9; --paper:#FFFFFF; --ink:#172033; --ink2:#4A5670; --mute:#8590A6; --line:#DCE2EE; --soft:#F6F8FC;
  --accent:#1F3F9E; --accent-soft:#E3EAFB; --on-accent:#FFFFFF;
  --side:#1B347F; --side2:#244499; --side-ink:#E9EEFF; --side-mute:#A9B7E3;
  --red:#D2362F; --red-soft:#FDE9E7; --amber:#B86E00; --amber-soft:#FFF1D9; --green:#178A4C; --green-soft:#E1F4E8;
  --f-body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1424; --paper:#161E33; --ink:#E4E9F5; --ink2:#AEB9D3; --mute:#7C88A6; --line:#28324D; --soft:#1B2440;
  --accent:#8FA9F5; --accent-soft:#1F2C55; --on-accent:#0B1430;
  --side:#0A1230; --side2:#16224A; --side-ink:#E4E9F5; --side-mute:#8D9BC7;
  --red:#F2827A; --red-soft:#3A1D1E; --amber:#E9B45C; --amber-soft:#3A2C14; --green:#6DD39C; --green-soft:#14301F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1424; --paper:#161E33; --ink:#E4E9F5; --ink2:#AEB9D3; --mute:#7C88A6; --line:#28324D; --soft:#1B2440;
  --accent:#8FA9F5; --accent-soft:#1F2C55; --on-accent:#0B1430;
  --side:#0A1230; --side2:#16224A; --side-ink:#E4E9F5; --side-mute:#8D9BC7;
  --red:#F2827A; --red-soft:#3A1D1E; --amber:#E9B45C; --amber-soft:#3A2C14; --green:#6DD39C; --green-soft:#14301F; color-scheme:dark}
html,body{margin:0;background:var(--bg)}
body{min-height:100dvh}
svg.i{width:16px;height:16px;flex:0 0 auto;vertical-align:-3px}

/* ===== 잠금 화면 ===== */
.lock{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--side);background:linear-gradient(160deg,var(--side) 0%,var(--side2) 100%)}
.lbox{background:var(--paper);border-radius:18px;width:min(420px,100%);padding:28px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.lbox h1{font-size:22px}
.lbox p{margin:0;font-size:13.5px;color:var(--ink2)}
.lbox input{height:48px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font-size:18px;letter-spacing:.2em;background:var(--soft);width:100%}
.lbox .go{width:100%}
.lbox .lnk{background:none;border:0;color:var(--mute);font-size:12.5px;text-decoration:underline;cursor:pointer;align-self:center}
.lmark{display:flex;align-items:center;gap:10px;color:var(--accent);font-weight:700}
.lmark svg{width:34px;height:34px}
.safe{display:flex;gap:8px;align-items:flex-start;background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.6}
.safe svg{color:var(--accent);margin-top:2px}

/* ===== 전체 틀 ===== */
.shell{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100dvh}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:10px;padding:18px 14px 14px;position:sticky;top:0;height:100dvh;overflow:auto}
.sbrand{display:flex;flex-direction:column;gap:2px;padding:0 4px 6px}
.sbrand b{font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.sbrand b svg{width:24px;height:24px}
.sbrand small{color:var(--side-mute);font-size:12px}
.sbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:10px;border:1px solid color-mix(in srgb,var(--side-ink) 22%,transparent);background:transparent;color:var(--side-ink);font-weight:700;font-size:15px;cursor:pointer;width:100%}
.sbtn.pri{background:#3D63D6;border-color:#3D63D6;color:#fff}
.sbtn:hover{filter:brightness(1.08)}
.sq{height:40px;border-radius:10px;border:0;padding:0 12px 0 36px;background:var(--paper);color:var(--ink);width:100%;font-size:14px}
.sqw{position:relative}.sqw svg{position:absolute;left:11px;top:12px;color:var(--mute)}
.sfilt{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.sfilt button{height:32px;border-radius:8px;border:1px solid color-mix(in srgb,var(--side-ink) 20%,transparent);background:transparent;color:var(--side-mute);font-size:13px;cursor:pointer}
.sfilt button[aria-pressed="true"]{background:var(--side2);color:#fff;border-color:transparent;font-weight:700}
.clist{display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-height:120px}
.cgrp{font-size:12px;color:var(--side-mute);padding:10px 6px 4px}
.citem{display:flex;flex-direction:column;gap:2px;text-align:left;border:0;border-radius:10px;background:transparent;color:var(--side-ink);padding:9px 10px;cursor:pointer;width:100%}
.citem:hover{background:color-mix(in srgb,var(--side2) 70%,transparent)}
.citem[aria-current="true"]{background:#3D63D6;color:#fff}
.citem .r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.citem .r1 b{font-size:15px}
.citem .r1 small{color:inherit;opacity:.75;font-size:12.5px}
.citem .r1 .stt{margin-left:auto;font-size:12px;font-weight:700;color:#7EE2A8}
.citem .r1 .stt.w{color:#FFD27A}
.citem .r2{font-size:12.5px;opacity:.85}
.citem .r2.ok{color:#9FE7BE;opacity:1}
.cempty{font-size:13px;color:var(--side-mute);padding:14px 8px;line-height:1.7}
.sfoot{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.sfoot button{height:34px;border-radius:8px;border:1px solid color-mix(in srgb,var(--side-ink) 20%,transparent);background:transparent;color:var(--side-ink);font-size:12.5px;cursor:pointer}
.sfoot button:hover{background:var(--side2)}
.slock{font-size:11.5px;color:var(--side-mute);display:flex;gap:6px;align-items:center;padding:4px 4px 0}

.main{min-width:0;padding:18px 22px 40px;display:flex;flex-direction:column;gap:14px}
.welcome{max-width:760px;margin:6vh auto 0;display:flex;flex-direction:column;gap:16px}
.welcome h2{font-size:24px}
.welcome p{margin:0;color:var(--ink2)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.step{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.step b{font-size:15px}.step span{font-size:13px;color:var(--ink2)}
.step i{font-style:normal;font:700 13px var(--f-mono);color:var(--accent);background:var(--accent-soft);border-radius:999px;width:26px;height:26px;display:grid;place-items:center}
@media (max-width:640px){.steps{grid-template-columns:1fr}}
.membanner{background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600}

/* 고객 머리글 */
.chead{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
.chead h2{font-size:26px;font-weight:700}
.cmeta{color:var(--ink2);font-size:14px}
.cact{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stbadge{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;font-weight:700;font-size:13.5px;background:var(--green);color:#fff}
.stbadge.w{background:var(--amber-soft);color:var(--amber)}
.btn{display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.lg{height:38px;padding:0 14px}
.back{display:none}
.memo{font-size:13.5px}
.memo summary{color:var(--ink2);font-weight:600}
.memo textarea{width:100%;min-height:70px;margin-top:6px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper);font:13.5px/1.6 var(--f-body);resize:vertical}
.rebase{font-size:12.5px;color:var(--mute)}
.rebase button{border:0;background:none;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:12.5px;padding:0}

/* 메인 탭 */
.ptabs{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;z-index:6;background:var(--bg);padding:6px 0}
.ptab{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:10px 10px 0 0;border:1px solid var(--line);border-bottom:0;background:var(--soft);color:var(--ink2);font-weight:600;font-size:15px;cursor:pointer}
.ptab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ptab .cnt{font:600 12px var(--f-mono);background:color-mix(in srgb,currentColor 14%,transparent);border-radius:999px;padding:0 7px;line-height:18px}
.ppane{display:flex;flex-direction:column;gap:12px}

/* 판정표 */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(440px,100%),1fr));gap:10px}
@media (max-width:560px){.pgrid{grid-template-columns:1fr}}
.pc{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.pc-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pc-h h4{margin:0;font-size:16px;font-weight:700;color:var(--accent);margin-right:auto}
.pc-a{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.pb{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.pb:hover{border-color:var(--accent);color:var(--accent)}
.bdg{display:inline-flex;align-items:center;height:26px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:700}
.bdg.y{background:var(--red);color:#fff}.bdg.c{background:var(--amber);color:#fff}.bdg.n{background:var(--green);color:#fff}
.pl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pl li{display:grid;grid-template-columns:minmax(0,1fr) 64px 92px;align-items:center;gap:8px;font-size:14px;padding:3px 0;border-top:1px dashed var(--line)}
.pl li:first-child{border-top:0}
.pl li .n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pl li .n small{display:block;font-size:11px;color:var(--amber);line-height:1.1}
.pl .s{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13.5px}
.pl .s.y{color:var(--red)}.pl .s.c{color:var(--amber)}.pl .s.n{color:var(--green)}
.pfoot{font-size:12.5px;color:var(--mute);line-height:1.8}
.psum{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.psum .chipx{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:13.5px;font-weight:700;background:var(--paper);border:1px solid var(--line)}
.psum .chipx.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,var(--line))}
.psum .chipx.bad{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}

/* 진료이력 */
.hbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.hbar .sp{margin-left:auto}
table.ht{min-width:960px}
table.ht thead th{background:var(--accent);color:var(--on-accent);font-size:13px;position:sticky;top:0}
table.ht td{padding:6px 10px;font-size:13.5px;vertical-align:middle}
table.ht td.c{text-align:center}
table.ht tr.grp td{background:var(--accent-soft);color:var(--accent);font-weight:700;padding:7px 10px}
table.ht tr.grp td svg{margin-right:6px}
table.ht td.unk{color:var(--mute)}
.tw.ht-w{max-height:72vh;overflow:auto}
.ckm{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;font-size:12px;font-weight:700;color:#fff}
.ckm.y{background:var(--green)}.ckm.n{background:color-mix(in srgb,var(--red) 80%,transparent)}
.ckm.n{opacity:.55}
.notes{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:12.5px;color:var(--ink2);line-height:1.8;margin:0;list-style:none}
.notes li::before{content:"※ "}

/* 미청구 */
.gcards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:760px){.gcards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gc{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column}
.gc span{font-size:12.5px;color:var(--mute)}
.gc b{font:700 19px var(--f-mono);color:var(--accent);font-variant-numeric:tabular-nums}
.gc small{font-size:11px;color:var(--mute)}
table.cl{min-width:880px}
table.cl thead th{background:var(--accent);color:var(--on-accent);text-align:center;font-size:13px}
table.cl td{padding:5px 10px;font-size:13.5px;white-space:nowrap}
table.cl td.r{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
table.cl tr.tot td{background:var(--accent-soft);color:var(--accent);font-weight:700}
table.cl tr.tot td.g{color:var(--red)}
table.cl td.z{color:var(--mute)}
table.cl td.inp{color:var(--red);font-weight:700}
.subt{font-size:13px;color:var(--ink2)}

/* 상품 상세 */
.pvh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pvh h3{font-size:19px;margin-right:auto}
.pnote{background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--ink)}

/* 파일 첨부 창 */
.fbox{width:min(640px,100%)}
.fbox h4{display:flex;gap:8px;align-items:center}
.fdrop{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;background:var(--soft);cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center}
.fdrop.on{border-color:var(--accent);background:var(--accent-soft)}
.fdrop b{font-size:14.5px}.fdrop small{color:var(--mute);font-size:12.5px;line-height:1.6}
.flist{min-height:90px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:2px;background:var(--paper)}
.frow{display:flex;gap:8px;align-items:center;font-size:13.5px;padding:4px 6px;border-radius:6px}
.frow:hover{background:var(--soft)}
.frow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow i{font-style:normal;font-size:12px;color:var(--mute)}
.frow.ok i{color:var(--green);font-weight:600}.frow.bad i{color:var(--red);font-weight:600}
.frow button{border:0;background:none;color:var(--mute);cursor:pointer;font-size:16px;line-height:1}
.fneed{display:flex;flex-wrap:wrap;gap:4px}
.fneed span{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--mute)}
.fneed span.on{background:var(--green-soft);color:var(--green);border-color:transparent;font-weight:600}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}

/* 고객 등록 창 */
.form{display:flex;flex-direction:column;gap:12px}
.form label.l{font-size:13px;font-weight:600;color:var(--ink2)}
.form input[type=text],.form input[type=password],.form input[inputmode]{height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--paper);width:100%;font-size:15px}
.form textarea{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--paper);width:100%;min-height:60px;font:14px/1.6 var(--f-body)}
.sexsel{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sexsel button{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-weight:700;cursor:pointer}
.sexsel button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.consent{display:flex;gap:8px;align-items:center;font-size:13px}
.mbox .mrow .go{height:42px;padding:0 20px;font-size:15px}
.mbox.wide{width:min(760px,100%)}
.ferr{color:var(--red);font-size:13px;white-space:pre-line}
.fwarn{background:var(--amber-soft);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:13px;white-space:pre-line}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;min-height:100dvh}
  .shell.has-c .side{display:none}
  .shell:not(.has-c) .main{display:none}
  .main{padding:12px 14px 40px}
  .back{display:inline-flex}
  .chead h2{font-size:22px}
  .cact{margin-left:0;width:100%}
  .ptabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .ptab{padding:0 12px;font-size:14px;height:40px;flex:0 0 auto}
  .ptab .lbl-long{display:none}
}
@media print{.side,.ptabs,.cact,.hbar .seg,.memo{display:none!important}.shell{display:block}}
/* 숫자: 본문 글꼴 + 고정폭 숫자 (오프라인에서도 한글이 고르게 보이도록) */
table.cl td.r,table.ht td.n,.gc b,.pl li .n{font-family:var(--f-body);font-variant-numeric:tabular-nums}
.gc b{font-weight:700}

.fchoice{background:var(--amber-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.6}
.fchoice .mrow{flex-wrap:wrap}
.fchoice .go{height:42px;padding:0 18px;font-size:15px}
.mbox{overflow:auto;max-height:calc(100dvh - 32px)}

/* 구글 동기화 */
.ssync{display:flex;flex-direction:column;gap:6px;border-top:1px solid color-mix(in srgb,var(--side-ink) 15%,transparent);padding-top:10px}
.ssync small{color:var(--side-mute);font-size:12px;line-height:1.5}
.ssync .sbtn{height:40px;font-size:13.5px}
.ss-row{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;font-weight:600}
.ss-row svg{margin-top:2px;color:#7EE2A8}
.ss-row b.w{color:#FFD27A}
.ss-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ss-btns button{height:32px;border-radius:8px;border:1px solid color-mix(in srgb,var(--side-ink) 20%,transparent);background:transparent;color:var(--side-ink);font-size:12.5px;cursor:pointer}
.ss-btns button:disabled{opacity:.5}
/* 병력파악 날짜 */
.dbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.dchip{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.dchip small{font-size:12px;color:var(--mute)}
.dchip b{font-size:17px;font-variant-numeric:tabular-nums}
.dchip em{font-style:normal;font-size:11.5px;color:var(--mute);line-height:1.4}
.dchip.fr.g{border-color:color-mix(in srgb,var(--green) 45%,var(--line));background:var(--green-soft)}.dchip.fr.g b{color:var(--green)}
.dchip.fr.a{border-color:color-mix(in srgb,var(--amber) 45%,var(--line));background:var(--amber-soft)}.dchip.fr.a b{color:var(--amber)}
.dchip.fr.r{border-color:color-mix(in srgb,var(--red) 45%,var(--line));background:var(--red-soft)}.dchip.fr.r b{color:var(--red)}
.dchip.ap input{height:30px;border:1px solid var(--line);border-radius:6px;padding:0 6px;background:var(--paper);font:inherit;font-size:14px;width:100%}
.dchip .lnk{border:0;background:none;color:var(--accent);text-decoration:underline;font-size:12px;cursor:pointer;padding:0;align-self:flex-start}
.gapban{display:flex;gap:8px;align-items:flex-start;border-radius:10px;padding:9px 12px;font-size:13.5px;line-height:1.6}
.gapban.a{background:var(--amber-soft);color:var(--ink)}.gapban.a svg{color:var(--amber)}
.gapban.r{background:var(--red-soft);color:var(--ink)}.gapban.r svg{color:var(--red)}
.gapban svg{margin-top:3px}
.applybox{background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:13.5px;line-height:1.6}
.applybox ul{margin:6px 0 0;padding-left:18px}
.citem .r3{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.9}
.fp{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
.fp.g{background:#7EE2A8}.fp.a{background:#FFD27A}.fp.r{background:#FF8A80}
.prevrec{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;color:var(--ink2)}
/* 서류 받기 */
.cinfo{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cinfo button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.cinfo button b{font-variant-numeric:tabular-nums}
.cph{display:inline-flex;gap:4px;align-items:center}
.cph input{height:34px;border:1px solid var(--line);border-radius:999px;padding:0 12px;width:190px;background:var(--paper);font:inherit;font-size:13px}
.dlist{display:flex;flex-direction:column;gap:8px}
.ditem{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper);display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.ditem.on{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 40%,var(--line))}
.ditem .dh{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ditem .dck{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14.5px;margin-right:auto}
.ditem .dck input{width:18px;height:18px}
.ditem .dg{color:var(--ink)}.ditem .dp{color:var(--mute);font-size:12.5px}
.ditem ul{margin:2px 0 0;padding-left:18px;color:var(--ink2);font-size:12.5px}
.lnk2{border:0;background:none;color:var(--accent);cursor:pointer;font-size:13px;padding:0;display:inline-flex;gap:4px;align-items:center;text-decoration:underline}

/* SMemo 복사 감지 */
.sclip button{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:1px solid color-mix(in srgb,var(--side-ink) 20%,transparent);background:transparent;color:var(--side-ink);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:13px}
.sclip button[aria-pressed="false"]{opacity:.65}
.sclip small{color:var(--side-mute);font-size:11.5px}
.sclip svg{margin-top:2px}
.clipcard{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;width:min(420px,calc(100vw - 32px));background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(10,20,40,.22);padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.cc-h{display:flex;gap:8px;align-items:center}.cc-h svg{color:var(--accent)}
.cc-x{margin-left:auto;border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--mute)}
.cc-r{display:flex;gap:6px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px}
.cc-r span{margin-right:auto}
.smb{display:flex;flex-direction:column;gap:6px;background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.smb-r{display:flex;gap:8px;flex-wrap:wrap}
.smb-r .go{height:42px;padding:0 16px;font-size:14.5px}
.smb-r label.btn{cursor:pointer}

.updbar{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:80;width:min(680px,calc(100vw - 32px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--paper);border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:14px;padding:10px 14px;box-shadow:0 12px 30px rgba(10,20,40,.2);font-size:14px}
.updbar svg{color:var(--green)}
.updbar span{flex:1 1 220px}
.updbar .go{height:38px;padding:0 16px;font-size:14px}

/* =====================================================================
   PREMIUM LAYER — 미드나잇 네이비 × 샴페인 골드
   ===================================================================== */
:root{
  --bg:#F3F4F8; --paper:#FFFFFF; --ink:#0E1630; --ink2:#4A5573; --mute:#8892AA; --line:#E3E6EF; --soft:#F7F8FC;
  --accent:#17286B; --accent-soft:#ECEFFB; --on-accent:#FFFFFF;
  --gold:#B08A4E; --gold2:#D9BC86; --gold-soft:#F7F0E3; --gold-ink:#7A5A26;
  --side:#0A1230; --side2:#1A2759; --side-ink:#EEF1FB; --side-mute:#98A3C7;
  --red:#C8352E; --red-soft:#FCEBE9; --amber:#B06A00; --amber-soft:#FFF3DE; --green:#16804A; --green-soft:#E3F4EA; --blue:#2F5BD3; --blue-soft:#E8EEFD;
  --sh1:0 1px 2px rgba(14,22,48,.05),0 1px 1px rgba(14,22,48,.03);
  --sh2:0 1px 2px rgba(14,22,48,.04),0 8px 24px -10px rgba(14,22,48,.14);
  --sh3:0 24px 60px -24px rgba(10,18,48,.45);
  --hero:linear-gradient(135deg,#0B1435 0%,#16255E 55%,#22357A 100%);
  --f-body:"Pretendard","Pretendard Variable","IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#080C19; --paper:#10172B; --ink:#E8ECF6; --ink2:#AEB7CC; --mute:#78839C; --line:#222B44; --soft:#141C33;
  --accent:#AFC0F5; --accent-soft:#1A2550; --on-accent:#0A1230;
  --gold:#D8B57A; --gold2:#EBD3A3; --gold-soft:#2A2213; --gold-ink:#E7C88F;
  --side:#060A17; --side2:#18234D; --side-ink:#E8ECF6; --side-mute:#8791B3;
  --red:#F08A80; --red-soft:#3A1C1E; --amber:#EBB55E; --amber-soft:#36290F; --green:#6FD4A0; --green-soft:#11301F; --blue:#8FB0FF; --blue-soft:#17254D;
  --sh1:0 1px 2px rgba(0,0,0,.3); --sh2:0 1px 2px rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.6); --sh3:0 24px 60px -20px rgba(0,0,0,.7);
  --hero:linear-gradient(135deg,#0B1330 0%,#16224F 60%,#1F2F6A 100%); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080C19; --paper:#10172B; --ink:#E8ECF6; --ink2:#AEB7CC; --mute:#78839C; --line:#222B44; --soft:#141C33;
  --accent:#AFC0F5; --accent-soft:#1A2550; --on-accent:#0A1230;
  --gold:#D8B57A; --gold2:#EBD3A3; --gold-soft:#2A2213; --gold-ink:#E7C88F;
  --side:#060A17; --side2:#18234D; --side-ink:#E8ECF6; --side-mute:#8791B3;
  --red:#F08A80; --red-soft:#3A1C1E; --amber:#EBB55E; --amber-soft:#36290F; --green:#6FD4A0; --green-soft:#11301F; --blue:#8FB0FF; --blue-soft:#17254D;
  --sh1:0 1px 2px rgba(0,0,0,.3); --sh2:0 1px 2px rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.6); --sh3:0 24px 60px -20px rgba(0,0,0,.7);
  --hero:linear-gradient(135deg,#0B1330 0%,#16224F 60%,#1F2F6A 100%); color-scheme:dark}
body{font-family:var(--f-body);letter-spacing:-.005em;font-feature-settings:"tnum" 0}
::selection{background:color-mix(in srgb,var(--gold) 35%,transparent)}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}

/* 잠금 */
.lock{background:radial-gradient(1200px 600px at 80% -10%,#24387F 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#3A2E14 0%,transparent 55%),#070C1E}
.lbox{border-radius:22px;padding:34px 30px;box-shadow:var(--sh3);border:1px solid color-mix(in srgb,var(--gold) 22%,transparent)}
.lmark{color:var(--ink)}.lmark svg{color:var(--gold)}
.lbox input{border-radius:12px;height:52px;background:var(--soft)}
.lbox input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 18%,transparent)}

/* 사이드바 */
.side{background:linear-gradient(180deg,#0A1230 0%,#0E1839 60%,#101C42 100%);border-right:1px solid rgba(255,255,255,.04);gap:12px;padding:22px 16px 16px}
.sbrand{padding:2px 6px 12px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:2px}
.sbrand b{font-size:18px;font-weight:700;letter-spacing:-.02em}
.sbrand b svg{color:var(--gold2);filter:drop-shadow(0 2px 6px rgba(217,188,134,.35))}
.sbrand small{font-size:11.5px;letter-spacing:.01em}
.sbtn{border-radius:12px;border-color:rgba(255,255,255,.12);font-weight:600;transition:background .15s,transform .1s}
.sbtn.pri{background:linear-gradient(135deg,#E3C891 0%,#C9A465 55%,#B08A4E 100%);border:0;color:#1B1408;box-shadow:0 8px 20px -10px rgba(217,188,134,.7),inset 0 1px 0 rgba(255,255,255,.4)}
.sbtn.pri:hover{filter:brightness(1.04)}
.sbtn:active{transform:translateY(1px)}
.sq{border-radius:12px;background:rgba(255,255,255,.07);color:var(--side-ink);border:1px solid rgba(255,255,255,.08)}
.sq::placeholder{color:var(--side-mute)}
.sqw svg{color:var(--side-mute)}
.sfilt{background:rgba(255,255,255,.05);border-radius:12px;padding:3px;gap:2px}
.sfilt button{border:0;border-radius:9px;height:30px;font-size:12.5px}
.sfilt button[aria-pressed="true"]{background:rgba(255,255,255,.12);color:#fff}
.cgrp{font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:12px 8px 4px;color:#6F7AA3}
.citem{border-radius:12px;padding:10px 12px;position:relative;transition:background .15s}
.citem:hover{background:rgba(255,255,255,.05)}
.citem[aria-current="true"]{background:linear-gradient(90deg,rgba(217,188,134,.16),rgba(255,255,255,.05));color:#fff;box-shadow:inset 3px 0 0 var(--gold2)}
.citem .r1 .stt{color:#8FE0B4;font-weight:600}
.citem .r1 .stt.w{color:var(--gold2)}
.citem .r2{opacity:.72}
.citem .r2.ok{color:#9FE7BE}
.sfoot button,.ss-btns button{border-color:rgba(255,255,255,.1);border-radius:10px}
.sfoot button:hover,.ss-btns button:hover{background:rgba(255,255,255,.06)}
.ssync,.sclip{border-top-color:rgba(255,255,255,.07)}
.slock{opacity:.8}

/* 메인 */
.main{padding:26px 34px 56px;gap:18px;max-width:1480px}
@media (max-width:900px){.main{padding:14px 14px 40px}}
.btn{border-radius:10px;border-color:var(--line);background:var(--paper);box-shadow:var(--sh1);transition:border-color .15s,background .15s,color .15s}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));color:var(--accent)}
.btn.lg{height:40px;padding:0 16px;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff;box-shadow:none}
.btn.ghost:hover{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.3)}
.go{border-radius:12px;background:linear-gradient(135deg,#22378A 0%,#17286B 100%);box-shadow:0 10px 24px -12px rgba(23,40,107,.7),inset 0 1px 0 rgba(255,255,255,.12);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,filter .15s}
.go:hover{filter:brightness(1.08)}.go:active{transform:translateY(1px)}
:root[data-theme="dark"] .go{background:linear-gradient(135deg,#3B55B8,#2A3F94);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .go{background:linear-gradient(135deg,#3B55B8,#2A3F94);color:#fff}}
.go.kakao{background:#FEE500;color:#191600;box-shadow:0 10px 24px -12px rgba(254,229,0,.8)}
.empty{border-radius:16px;box-shadow:var(--sh1);padding:20px}
.empty.sm{padding:14px 16px;font-size:13.5px}

/* 고객 머리글 */
.chead{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px 22px;box-shadow:var(--sh2);gap:10px 16px}
.chead h2{font-size:27px;letter-spacing:-.025em;display:flex;align-items:center;gap:12px}
.chead h2::before{content:attr(data-i);width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:19px;font-weight:700;color:#1B1408;background:linear-gradient(135deg,#E9D3A4,#C9A465);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.cmeta{font-size:14px;color:var(--mute)}
.stbadge{background:var(--green-soft);color:var(--green);height:30px;font-size:12.5px;letter-spacing:.02em}
.stbadge.w{background:var(--gold-soft);color:var(--gold-ink)}
.memo{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:var(--sh1)}
.memo textarea{border-radius:10px;background:var(--soft)}

/* 날짜 칩 */
.dbar{gap:10px}
.dchip{border-radius:14px;padding:11px 14px;box-shadow:var(--sh1);gap:2px}
.dchip small{font-size:11px;letter-spacing:.08em;font-weight:600}
.dchip b{font-size:18px;letter-spacing:-.01em}
.gapban{border-radius:14px;padding:11px 14px}
.membanner{border-radius:12px}

/* 탭: 세그먼트 */
.ptabs{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:8px 0;gap:4px;border-bottom:1px solid var(--line)}
.ptab{border:0;border-radius:12px;height:42px;background:transparent;color:var(--ink2);padding:0 16px;font-size:14.5px;transition:background .15s,color .15s}
.ptab:hover{background:var(--paper);color:var(--ink)}
.ptab[aria-selected="true"]{background:var(--paper);color:var(--accent);box-shadow:var(--sh2),inset 0 -2px 0 var(--gold)}
.ptab .cnt{background:var(--gold-soft);color:var(--gold-ink)}
.ptab[aria-selected="true"] .cnt{background:var(--accent);color:var(--on-accent)}

/* 카드류 */
.pc,.step,.gc,.notes,.ditem,.applybox{border-radius:16px;box-shadow:var(--sh1)}
.pc{padding:16px 18px;gap:8px;transition:box-shadow .2s,border-color .2s}
.pc:hover{box-shadow:var(--sh2);border-color:color-mix(in srgb,var(--accent) 18%,var(--line))}
.pc-h h4{color:var(--ink);font-size:16.5px;letter-spacing:-.015em}
.bdg{height:24px;font-size:12px;padding:0 10px;letter-spacing:.02em}
.bdg.y{background:var(--red-soft);color:var(--red)}.bdg.c{background:var(--amber-soft);color:var(--amber)}.bdg.n{background:var(--green-soft);color:var(--green)}
.pb{border-radius:9px}
.pl li{border-top:1px solid var(--line);padding:6px 0}
.psum .chipx{box-shadow:var(--sh1)}
.welcome h2{font-size:28px;letter-spacing:-.03em}
.step i{background:linear-gradient(135deg,#E9D3A4,#C9A465);color:#1B1408}
.step{padding:18px}

/* 표 */
.tw{border-radius:16px;box-shadow:var(--sh1)}
table.t th,table.ht thead th,table.cl thead th{background:var(--soft);color:var(--ink2);font-size:12px;font-weight:600;letter-spacing:.04em;border-bottom:1px solid var(--line);padding:11px 12px}
table.t td{border-top-color:var(--line)}
table.t tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
table.ht tr.grp td{background:linear-gradient(90deg,var(--accent-soft),transparent);color:var(--accent)}
table.cl tr.tot td{background:var(--gold-soft);color:var(--gold-ink)}
table.cl tr.tot td.g{color:var(--gold-ink)}
.gc{padding:14px 16px;gap:2px}
.gc b{color:var(--ink);font-size:20px;letter-spacing:-.02em}
.gc.on{border-color:var(--gold);background:var(--gold-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 18%,transparent)}
.gc.on b{color:var(--gold-ink)}
.notes{padding:12px 16px}
.seg{border-radius:12px;padding:3px;background:var(--soft);gap:2px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{border-radius:9px;padding:7px 14px}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--accent);box-shadow:var(--sh1)}

/* 모달 */
.modal{background:rgba(6,10,26,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.mbox{border-radius:20px;padding:22px;box-shadow:var(--sh3);border:1px solid var(--line)}
.mbox h4{font-size:18px;letter-spacing:-.02em;margin:0;display:flex;gap:8px;align-items:center}
.fdrop{border-radius:16px;padding:22px}
.toast{border-radius:12px;box-shadow:var(--sh3);background:#0E1630;color:#EEF1FB}

/* ===== 미청구 · 보장 히어로 ===== */
.khero,.cvhero{position:relative;overflow:hidden;background:var(--hero);color:#F2F4FB;border-radius:22px;padding:24px 26px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 26px;align-items:end;box-shadow:var(--sh3)}
.khero::after,.cvhero::after{content:"";position:absolute;right:-80px;top:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(217,188,134,.28),transparent 65%);pointer-events:none}
.khero .eyebrow,.cvhero .eyebrow{color:#B9C3E6}
.kh-main,.cvhero>div:first-child{display:flex;flex-direction:column;gap:6px;min-width:0}
.kh-num{font-size:44px;font-weight:700;letter-spacing:-.035em;line-height:1.05;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#F6E6C4 0%,#D9BC86 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.kh-num small{font-size:22px;margin-left:4px}
.kh-sub{font-size:14px;color:#CBD3EE}.kh-sub b{color:#fff}.kh-sub em{font-style:normal;color:var(--gold2)}
.kh-side{display:flex;gap:10px;position:relative;z-index:1}
.kh-side>div,.cvk>div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px 16px;min-width:116px;display:flex;flex-direction:column}
.kh-side small,.cvk small{font-size:11.5px;color:#AFB9DD;letter-spacing:.04em}
.kh-side b,.cvk b{font-size:22px;letter-spacing:-.02em;color:#fff}
.kh-side .warn{border-color:rgba(255,138,128,.5);background:rgba(255,138,128,.12)}.kh-side .warn b{color:#FFB1A9}
.kh-act{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.kh-act .go{background:linear-gradient(135deg,#E9D3A4 0%,#C9A465 60%,#B08A4E 100%);color:#1B1408;height:44px;padding:0 20px;font-size:15px;box-shadow:0 10px 24px -12px rgba(217,188,134,.8),inset 0 1px 0 rgba(255,255,255,.45)}
:root .kh-act .go{background:linear-gradient(135deg,#E9D3A4 0%,#C9A465 60%,#B08A4E 100%);color:#1B1408}
.cvk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;position:relative;z-index:1}
.cvk b{font-size:17px}
@media (max-width:900px){.khero,.cvhero{grid-template-columns:1fr;padding:20px}.kh-num{font-size:36px}.cvk{grid-template-columns:repeat(2,minmax(0,1fr))}.kh-side>div{flex:1;min-width:0}}
.kgen{display:flex;gap:12px 18px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 16px;box-shadow:var(--sh1)}
.kg-l{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 320px}
.kg-l .plan{font-size:13.5px;color:var(--ink2)}.kg-l .plan b{color:var(--ink)}
.kg-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gen{font-style:normal;display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;background:var(--gold-soft);color:var(--gold-ink);font-size:12px;font-weight:700;letter-spacing:.02em}
.cvhero .gen{background:rgba(217,188,134,.18);color:var(--gold2)}
.gseg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px;box-shadow:inset 0 0 0 1px var(--line);flex-wrap:wrap}
.gseg button{border:0;background:transparent;border-radius:9px;height:32px;padding:0 11px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.gseg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:var(--sh1)}
.ksec{display:flex;gap:6px 14px;align-items:baseline;flex-wrap:wrap;justify-content:space-between;margin-top:6px}
.ksec h3{font-size:17px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.ksec h3 svg{color:var(--gold)}
.ksec .cnt,.rh3 .cnt{font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 9px}
.rh3{font-size:16px;margin:18px 0 8px}
.tgl{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink2);cursor:pointer}
.tgl input{width:16px;height:16px;accent-color:var(--accent)}
.fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
@media (max-width:560px){.fcards{grid-template-columns:1fr}}
.fcard{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--sh2);position:relative}
.fcard::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.fcard.st-done{opacity:.6}.fcard.st-done::before{background:var(--green)}
.fcard.st-skip{opacity:.45}.fcard.st-skip::before{background:var(--mute)}
.fcard.st-sent::before{background:var(--blue)}
.fc-h{display:flex;align-items:center;gap:8px}
.fc-h b{font-size:16.5px;letter-spacing:-.02em;margin-right:auto}
.fc-m{font-size:13.5px;color:var(--ink2)}
.fc-c{font-size:13px;color:var(--mute)}.fc-c .mono{color:var(--accent);font-weight:600}
.fc-i{list-style:none;margin:4px 0 0;padding:8px 0 0;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:4px}
.fc-i li{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.fc-i li span{min-width:0;color:var(--ink2)}

.fc-f{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}

.fc-n{font-size:12px;color:var(--mute)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:7px;font-size:11.5px;font-weight:700;background:var(--soft);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.tag.진단{background:var(--red-soft);color:var(--red);border-color:transparent}
.tag.수술{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.tag.입원{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.tag.상해{background:var(--green-soft);color:var(--green);border-color:transparent}
.tag.sil{background:var(--gold-soft);color:var(--gold-ink);border-color:transparent}
.tag.x{background:var(--soft);color:var(--mute)}
.dd{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--soft);color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.dd.a{background:var(--amber-soft);color:var(--amber)}
.dd.r{background:var(--red);color:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 18%,transparent);animation:ddp 2.4s ease-in-out infinite}
.dd.over{background:var(--soft);color:var(--mute);text-decoration:line-through}
@keyframes ddp{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--red) 0%,transparent)}}
@media (prefers-reduced-motion:reduce){.dd.r{animation:none}}
.stb{display:inline-flex;background:var(--soft);border-radius:9px;padding:2px;gap:1px;box-shadow:inset 0 0 0 1px var(--line)}
.stb button{border:0;background:transparent;border-radius:7px;height:26px;padding:0 9px;font-size:12px;font-weight:600;color:var(--mute);cursor:pointer;white-space:nowrap}
.stb button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:var(--sh1)}
.stb button[data-st="done"][aria-pressed="true"]{background:var(--green);color:#fff}
.stb button[data-st="skip"][aria-pressed="true"]{background:var(--mute);color:#fff}
table.kl{min-width:860px}
table.kl td{vertical-align:middle;white-space:nowrap}
table.kl td.r,table.kl th.r{text-align:right;font-variant-numeric:tabular-nums}
table.kl .hl{background:color-mix(in srgb,var(--gold-soft) 70%,transparent);font-weight:700;color:var(--ink)}
table.kl thead th.hl{color:var(--gold-ink)}
table.kl tr.z td{color:var(--mute)}
table.kl tr.st-done td{opacity:.55}table.kl tr.st-skip td{opacity:.4;text-decoration:line-through}
table.kl tr.st-sent td:first-child{box-shadow:inset 3px 0 0 var(--blue)}
table.kl td.inp{color:var(--red);font-weight:700}
.kcmp{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:var(--sh1)}
.kcmp summary{cursor:pointer;font-weight:600;color:var(--ink2);font-size:14px}
.kcmp[open]{display:flex;flex-direction:column;gap:10px}
.kcmp .tw{box-shadow:none}
.klog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh1);overflow:hidden}
.klog li{display:flex;gap:6px 12px;align-items:baseline;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);font-size:13.5px}
.klog li:first-child{border-top:0}
.klog time{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;min-width:96px}
.klog b{font-weight:600;margin-right:auto}
.klog .mono{color:var(--gold-ink);font-weight:700}
.klog details{flex-basis:100%}.klog summary{font-size:12.5px;color:var(--accent);cursor:pointer}
.klog pre{white-space:pre-wrap;font:13px/1.65 var(--f-body);background:var(--soft);border-radius:10px;padding:10px 12px;margin:6px 0 0;max-height:260px;overflow:auto}
.kbox{width:min(640px,100%)}
.ktxt{width:100%;min-height:340px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font:14px/1.7 var(--f-body);background:#FBF8EE;color:#1E1A10;resize:vertical}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ktxt{background:#1A1810;color:#F1EBD9}}
:root[data-theme="dark"] .ktxt{background:#1A1810;color:#F1EBD9}
.krow{display:flex;flex-direction:column;gap:4px}
.krow .l{font-size:12.5px;font-weight:600;color:var(--ink2)}
.krow input{height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--paper)}
/* 보장 현황 */
.cvlist{display:flex;flex-direction:column;gap:10px}
.cvc{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh1);overflow:hidden}
.cvc.end{opacity:.6}
.cvc summary{display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;padding:14px 18px;cursor:pointer;list-style:none}
.cvc summary::-webkit-details-marker{display:none}
.cvc summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);margin-left:4px;transition:transform .2s}
.cvc[open] summary::after{transform:rotate(-135deg)}
.cvc[open] summary{border-bottom:1px solid var(--line);background:var(--soft)}
.cvc .co{font-weight:700;font-size:14px;color:var(--accent);min-width:84px}
.cvc .pn{font-weight:600;font-size:15px;flex:1 1 280px;min-width:0;letter-spacing:-.01em}
.cvc .cvm{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.cvc .cvn{font-size:12px;color:var(--mute);margin-left:auto}
table.cvr{min-width:0}
table.cvr td{padding:8px 18px;vertical-align:middle}
table.cvr td:first-child{width:64px}
table.cvr td.r{text-align:right;white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums}
.mt{font-size:11px;font-weight:700;color:var(--gold-ink);background:var(--gold-soft);border-radius:6px;padding:1px 6px;margin-left:4px;white-space:nowrap}
@media print{.khero,.cvhero{box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}.stb,.kh-act,.gseg{display:none!important}}
@media (max-width:600px){table.kl{min-width:520px}table.kl th:nth-child(4),table.kl td:nth-child(4),table.kl th:nth-child(5),table.kl td:nth-child(5){display:none}.ksec{flex-direction:column;align-items:flex-start}.kh-num{font-size:32px}}

.sfoot .adm{grid-column:1/-1;color:var(--gold2);border-color:rgba(217,188,134,.3)}
.admbox{width:min(860px,100%)}
.admsw{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.admadd{display:flex;gap:8px;flex-wrap:wrap}
.admadd input{flex:1 1 180px;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--paper);font:inherit}
.admadd .go{height:42px;padding:0 18px}
.admbox table.t{min-width:640px}.admbox table.t td{vertical-align:middle}
.admbox tr.u-off td{opacity:.6}.admbox tr.u-del td{opacity:.4}
.admbox .mono{font-family:var(--f-mono);font-size:13px;letter-spacing:.03em;white-space:nowrap}
#admBody{display:flex;flex-direction:column;gap:12px}

/* =====================================================================
   REFINED — 서류철 같은 단정함: 그림자·그라데이션을 걷어내고 선과 글자로 위계를 만든다
   ===================================================================== */
:root{
  --bg:#F3F4F6; --paper:#FFFFFF; --ink:#111827; --ink2:#4B5563; --mute:#8A919C; --line:#E4E7EB; --soft:#F8F9FA;
  --accent:#15245A; --accent-soft:#EEF1F8; --on-accent:#FFFFFF;
  --gold:#A8834A; --gold2:#C9A86E; --gold-soft:#F6F0E4; --gold-ink:#7A5B26;
  --side:#0E1838; --side2:#1B2756;
  --sh1:none; --sh2:0 1px 2px rgba(17,24,39,.04); --sh3:0 24px 48px -16px rgba(14,24,56,.35);
  --hero:#13204F;
  --f-body:"Pretendard Variable","Pretendard","IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0F1A; --paper:#121826; --ink:#E9ECF2; --ink2:#AAB2C0; --mute:#7A8394; --line:#232A3A; --soft:#161D2C;
  --accent:#B4C3F0; --accent-soft:#1A2444; --on-accent:#0B1230; --gold:#D2B47E; --gold2:#E2C795; --gold-soft:#29220F; --gold-ink:#E2C795;
  --side:#080C18; --side2:#161F40; --hero:#121B3E; --sh2:none}}
:root[data-theme="dark"]{
  --bg:#0B0F1A; --paper:#121826; --ink:#E9ECF2; --ink2:#AAB2C0; --mute:#7A8394; --line:#232A3A; --soft:#161D2C;
  --accent:#B4C3F0; --accent-soft:#1A2444; --on-accent:#0B1230; --gold:#D2B47E; --gold2:#E2C795; --gold-soft:#29220F; --gold-ink:#E2C795;
  --side:#080C18; --side2:#161F40; --hero:#121B3E; --sh2:none}
body{font-family:var(--f-body);font-size:15px;letter-spacing:-.006em;font-variant-numeric:tabular-nums}
.eyebrow{text-transform:none;letter-spacing:0;font-size:13px;font-weight:500;color:var(--mute)}
h1,h2,h3,h4{letter-spacing:-.02em}

/* 잠금: 단색 네이비, 장식 없음 */
.lock{background:var(--side)}
.lbox{border:0;border-radius:18px;padding:36px 32px}
.lmark svg{color:var(--gold)}
.lbox h1{font-size:24px;font-weight:700}

/* 사이드바: 단색, 금색은 '선택됨'에만 */
.side{background:var(--side);border-right:0}
.sbrand b svg{filter:none;color:var(--gold2)}
.sbtn.pri{background:var(--gold2);color:#1A1406;box-shadow:none}
.sbtn.pri:hover{filter:none;background:#D6B884}
.cgrp{text-transform:none;letter-spacing:0;font-size:12px;color:#7480A8}
.citem[aria-current="true"]{background:rgba(255,255,255,.06);box-shadow:inset 2px 0 0 var(--gold2)}

/* 기본 버튼: 그라데이션·광택 제거 */
.go{background:var(--accent);box-shadow:none;border-radius:10px;font-weight:600;letter-spacing:-.01em}
.go:hover{filter:none;background:#1C2E6E}
:root[data-theme="dark"] .go{background:#3550B0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .go{background:#3550B0}}
.btn{box-shadow:none;border-radius:9px;font-weight:500}
.btn.lg{height:38px}

/* 카드류: 그림자 대신 얇은 선 */
.chead,.pc,.step,.gc,.notes,.ditem,.applybox,.dchip,.memo,.empty,.tw,.kgen,.fcard,.kcmp,.klog,.cvc,.psum .chipx{box-shadow:none}
.chead{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:6px 0 16px}
.chead h2{font-size:28px;font-weight:700}
.chead h2::before{width:40px;height:40px;border-radius:10px;font-size:17px;color:var(--gold2);background:var(--accent);box-shadow:none}
:root[data-theme="dark"] .chead h2::before{background:#1E2B5C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chead h2::before{background:#1E2B5C}}
.pc:hover{box-shadow:none;border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.dchip{border-radius:12px}
.dchip small{letter-spacing:0;font-size:12px;font-weight:500}
.memo{border-radius:12px}

/* 탭: 밑줄형 */
.ptabs{gap:2px;padding:0;background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none}
.ptab{border-radius:0;height:46px;padding:0 14px;background:transparent;color:var(--mute);font-weight:600;box-shadow:none}
.ptab:hover{background:transparent;color:var(--ink)}
.ptab[aria-selected="true"]{background:transparent;color:var(--ink);box-shadow:inset 0 -2px 0 var(--gold)}
.ptab .cnt,.ptab[aria-selected="true"] .cnt{background:none;color:var(--mute);font:600 12.5px var(--f-body);padding:0}
.ptab[aria-selected="true"] .cnt{color:var(--gold-ink)}
.ptab svg{opacity:.75}

/* 표: 머리글은 조용하게 */
table.t th,table.ht thead th,table.cl thead th{background:var(--paper);color:var(--mute);font-size:12.5px;font-weight:600;letter-spacing:0;border-bottom:1px solid var(--line)}
table.t tbody tr:hover td{background:var(--soft)}
table.ht tr.grp td{background:var(--soft);color:var(--ink)}
table.ht tr.grp td svg{color:var(--gold)}
.tw{border-radius:12px}

/* 배지·상태: 채도 낮추고 점으로 */
.bdg{border-radius:6px;font-weight:600}
.stbadge{border-radius:6px;height:28px}
.tag{border-radius:6px}
.gen{border-radius:6px}
.mt{border-radius:5px}

/* 히어로(미청구·보장): 단색 네이비 + 숫자 하나만 강조 */
.khero,.cvhero{background:var(--hero);border-radius:16px;box-shadow:none;padding:26px 28px}
.khero::after,.cvhero::after{display:none}
.khero .eyebrow,.cvhero .eyebrow{color:#A9B4D8}
.kh-num{background:none;-webkit-background-clip:initial;background-clip:initial;color:#fff;font-size:46px;font-weight:700;letter-spacing:-.03em;padding-bottom:6px;border-bottom:2px solid var(--gold2);align-self:flex-start}
.kh-num small{color:#C9D0E8}
.kh-sub{color:#B9C2E0}
.kh-side{gap:0}
.kh-side>div,.cvk>div{background:none;border:0;border-left:1px solid rgba(255,255,255,.14);border-radius:0;padding:4px 20px;min-width:0}
.kh-side small,.cvk small{letter-spacing:0;color:#9EA9CF}
.kh-side .warn{background:none;border-color:rgba(255,255,255,.14)}.kh-side .warn b{color:#FFA49B}
.cvk{gap:0}
.kh-act .go{background:var(--gold2);color:#1A1406;box-shadow:none}
.kh-act .go:hover{background:#D6B884}
:root .kh-act .go{background:var(--gold2);color:#1A1406}
.btn.ghost{border-color:rgba(255,255,255,.22)}

/* 청구 카드: 왼쪽 금색 막대 대신 상단 정보 정렬 */
.fcard{border-radius:14px}
.fcard::before{width:2px;top:16px;bottom:16px}
.dd.r{animation:none;box-shadow:none}
.ksec h3{font-size:18px}
.ksec h3 svg{color:var(--gold)}
.gc.on{box-shadow:none}

/* 모달 */
.modal{background:rgba(8,12,26,.5);backdrop-filter:none;-webkit-backdrop-filter:none}
.mbox{border-radius:16px;border:0}
.toast{border-radius:10px;background:#111827}

@media (max-width:900px){.chead{padding-top:2px}.kh-side>div{padding:4px 14px}.kh-side>div:first-child,.cvk>div:nth-child(odd){border-left:0;padding-left:0}}
.mono,table.t td.n,table.ht td.n,.klog time,.admbox .mono,.fc-c .mono{font-family:var(--f-body);font-variant-numeric:tabular-nums;letter-spacing:0}
.admbox .mono{letter-spacing:.02em;font-weight:600}

.sclip .sc-auto{color:var(--side-mute);font-size:12.5px;padding:6px 10px 0}
.sclip .sc-auto input{accent-color:var(--gold2)}
/* 사이드바: 고객 목록만 스크롤, 아래 메뉴는 겹치지 않게 고정 */
.side{overflow:hidden}
.side>*{flex:0 0 auto}
.side>.clist{flex:1 1 0;min-height:140px;overflow-y:auto;overscroll-behavior:contain;margin:0 -6px;padding:0 6px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
.side>.clist::-webkit-scrollbar{width:6px}.side>.clist::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
.side>.ssync,.side>.sclip,.side>.sfoot,.side>.slock{position:relative;z-index:1;background:var(--side)}
@media (max-height:640px){.side{overflow:auto}.side>.clist{flex:0 0 auto;max-height:none;overflow:visible}}
@media (max-width:900px){.side{overflow:visible}.side>.clist{flex:0 0 auto;overflow:visible;min-height:0}}
/* 사이드바 아래쪽을 한 줄짜리 접이식 메뉴로 */
.smenu{border-top:1px solid rgba(255,255,255,.08);padding-top:8px}
.smenu summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--side-mute);padding:6px 4px;border-radius:8px}
.smenu summary::-webkit-details-marker{display:none}
.smenu summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:1.5px solid currentColor;border-top:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.smenu[open] summary::after{transform:rotate(135deg)}
.smenu summary:hover{color:var(--side-ink);background:rgba(255,255,255,.04)}
.smenu .sfoot{margin-top:6px}
.sclip button{padding:7px 10px}.sclip button small{display:none}
.sclip .sc-auto{padding:4px 10px 0}
.ssync{gap:6px;padding-top:8px}.ssync small{font-size:11.5px}
.slock{font-size:11px;padding-top:2px}
.smenu summary::after{transform:rotate(135deg)}
.smenu[open] summary::after{transform:rotate(-45deg)}
.citem{padding:8px 12px;gap:1px}
.citem .r2{font-size:12px}
.cgrp{padding:10px 8px 2px}
/* ===== 고객 카드 · 상담 기록 ===== */
.sfilt{grid-template-columns:auto auto 1fr}
.sfilt select{height:30px;border:0;border-radius:9px;background:rgba(255,255,255,.08);color:var(--side-ink);font:inherit;font-size:12.5px;padding:0 6px;min-width:0}
.sfilt select option{color:#111}
.sfilt button{padding:0 10px}
.citem .stg{font-style:normal;font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.08);color:var(--side-mute)}
.citem .stg.s-consult{color:#A9C3FF}.citem .stg.s-contract{color:var(--gold2)}.citem .stg.s-care{color:#8FE0B4}
.citem .r4{font-size:12px;color:var(--side-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem .r4.due{color:#FFB4AB;font-weight:600}
.ccard{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:2px 0}
.cc-stage{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.cc-stage button{border:0;background:transparent;border-radius:7px;height:30px;padding:0 12px;font:inherit;font-size:13px;font-weight:600;color:var(--mute);cursor:pointer}
.cc-stage button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.cc-info{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-size:14px}
.cc-ph{display:inline-flex;align-items:center;gap:6px}.cc-ph b{font-size:15px;letter-spacing:.01em}
.cc-ph .pb{text-decoration:none}
.cc-kv{display:inline-flex;gap:6px;align-items:baseline;color:var(--ink)}.cc-kv small{color:var(--mute);font-size:12px}
.cc-next{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13.5px;flex-wrap:wrap}
.cc-next small{color:var(--mute);margin-right:6px;font-size:12px}
.cc-next.due b{color:var(--red)}
.lgform{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.lg-k{display:inline-flex;gap:4px;flex-wrap:wrap}
.lg-k button{border:1px solid var(--line);background:var(--paper);border-radius:8px;height:32px;padding:0 12px;font:inherit;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.lg-k button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.lg-row{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.lg-row input,.lg-row textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--paper);font:inherit;font-size:14px;color:var(--ink)}
.lg-row input[type=date]{height:40px;padding:0 8px}
.lg-row textarea{flex:1 1 300px;min-height:40px;resize:vertical;line-height:1.55}

/* ===================== 디자인 정리 v3 — 색·글씨·간격·버튼·카드 한 규칙으로 ===================== */
:root[data-theme="dark"]{--paper:rgba(24,27,33,.8);--soft:rgba(255,255,255,.045);--line:rgba(255,255,255,.085);--ink:#EEF1F6;--ink2:#B9C0CC;--mute:#858D9C}
body{font-feature-settings:"tnum" 1}
/* 페이지 머리 */

.chead h2{font-size:26px;font-weight:800;letter-spacing:-.025em;display:flex;align-items:center;gap:12px}
:root[data-theme="dark"] .chead h2::before{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,rgba(79,125,255,.30),rgba(79,125,255,.08));border:1px solid rgba(124,156,255,.28);color:#C7D5FF;font-size:17px;font-weight:800;box-shadow:none}
.chead .cmeta{color:var(--mute);font-size:13px}
/* 카드 (공통 유리 카드) */
:root[data-theme="dark"] :is(.pc,.dchip,.tw,.step,.memo,.empty,.notes,.kgen,.fcard,.cvc,.lgform,.klog,.kcmp,.gc,.acfp){
  border:1px solid var(--line);border-radius:16px;background:var(--paper);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 16px 36px -24px rgba(0,0,0,.75)}

/* 버튼 */

:root[data-theme="dark"] .btn:hover{background:rgba(255,255,255,.075);border-color:rgba(255,255,255,.2);color:#fff}
:root[data-theme="dark"] :is(.go,.btn.pri,.sbtn.pri){background:linear-gradient(135deg,#4f7dff,#2f5fe0);border:0;border-radius:11px;color:#fff;font-weight:700;box-shadow:0 10px 22px -12px rgba(47,95,224,.9),inset 0 1px 0 rgba(255,255,255,.14)}
:root[data-theme="dark"] :is(.go,.btn.pri,.sbtn.pri):hover{filter:brightness(1.08);background:linear-gradient(135deg,#5a86ff,#3567ea)}
:root[data-theme="dark"] .pb{border-radius:9px;background:var(--soft);border-color:var(--line);color:var(--ink2)}
:root[data-theme="dark"] .pb:hover{color:#fff;border-color:rgba(255,255,255,.22)}
/* 단계·상태 선택 버튼 묶음 */

.citem .r4{display:flex;align-items:center;gap:6px;font-size:12.5px;opacity:1}

kbd{display:inline-block;font:600 11px/1 ui-monospace,Consolas,monospace;padding:3px 6px;border-radius:6px;border:1px solid rgba(255,255,255,.22);border-bottom-width:2px;background:rgba(255,255,255,.06);color:inherit;margin-left:4px;vertical-align:1px}

.hd{display:flex;flex-direction:column;gap:14px}

.hd-kpi button.warn{border-color:rgba(229,83,75,.55);background:rgba(229,83,75,.08)}.hd-kpi button.warn b{color:#ff8a80}

.hd-plan .hp-r{display:flex;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:14px}.hd-plan .hp-r:last-child{border:0}

.hd-plan .hp-r.c-r span{color:#ff8a80}.hd-plan .hp-r.c-g span{color:#7bd88f}.hd-plan .hp-r.c-b span{color:#9DB8FF}
.hd-plan h5 .lnk2{margin-left:8px;font-size:12.5px}
.hd-chips{display:flex;flex-wrap:wrap;gap:6px}
.hd-chips button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 12px 5px 5px;font-size:13.5px;cursor:pointer}
.hd-chips button:hover{border-color:var(--accent)}.hd-chips small{color:var(--mute);font-size:11.5px}
.hd-chips .cav{width:24px;height:24px;font-size:12px;font-style:normal}
@media (max-width:1100px){.hd-kpi{grid-template-columns:repeat(3,minmax(0,1fr))}.hd-grid{grid-template-columns:1fr}}
/* ===== PC 넓은 화면: 메뉴 | 고객 목록 | 내용 (3단) ===== */
@media (min-width:1180px){
  .shell:not(.mini){grid-template-columns:572px minmax(0,1fr)}

    grid-template-areas:"brand q" "game filt" "new chan" "nav list" "menu list" "sync list" "lock clip"}
  .shell:not(.mini) .side>.sbrand{grid-area:brand;padding:18px 14px 0}
  .shell:not(.mini) .side>.gchip{grid-area:game;margin:0 14px}
  .shell:not(.mini) .side>#newCust{grid-area:new;margin:0 14px}
  .shell:not(.mini) .side>.snav{grid-area:nav;grid-template-columns:1fr;margin:0 12px;gap:4px}
  .shell:not(.mini) .side>.smenu{grid-area:menu;margin:0 12px;overflow:auto;min-height:0}
  .shell:not(.mini) .side>.ssync{grid-area:sync;margin:0 14px}
  .shell:not(.mini) .side>.slock{grid-area:lock;margin:0 14px 14px}
  .shell:not(.mini) .side>.sqw{grid-area:q;margin:18px 14px 0 26px}
  .shell:not(.mini) .side>.sfilt{grid-area:filt;margin:0 14px 0 26px}
  .shell:not(.mini) .side>.schan{grid-area:chan;margin:0 14px 0 26px}
  .shell:not(.mini) .side>.clist{grid-area:list;overflow:auto;min-height:0;padding:0 8px 0 20px;max-height:none}
  .shell:not(.mini) .side>.sclip{grid-area:clip;margin:0 14px 0 26px}
  .shell:not(.mini) .side>#memBan{grid-area:lock}
  .shell:not(.mini) .side{isolation:isolate}
  .shell:not(.mini) .side::before{content:"";position:absolute;left:212px;top:0;bottom:0;right:0;background:rgba(0,0,0,.22);border-left:1px solid rgba(255,255,255,.07);z-index:-1;pointer-events:none}
  .shell:not(.mini) .snav .sct{min-height:42px;padding:6px 10px 6px 38px;flex-direction:row;align-items:center;justify-content:flex-start;gap:8px}
  .shell:not(.mini) .snav .sct small{display:none}
  .shell:not(.mini) .smenu>summary{display:none}
  .shell:not(.mini) .smenu .sfoot{display:flex;flex-direction:column;gap:2px;padding:0}
  .shell:not(.mini) .smenu .sfoot button{justify-content:flex-start;text-align:left;height:34px;padding:0 10px;border-radius:9px;background:transparent;border:0;font-size:13px;color:var(--side-ink);opacity:.82}
  .shell:not(.mini) .smenu .sfoot button:hover{background:rgba(255,255,255,.07);opacity:1}
  .shell:not(.mini) .sbrand small{display:none}
  .main{padding-left:32px;padding-right:32px}
  .citem .r1 .qmore{opacity:0}.citem:hover .r1 .qmore{opacity:.8}
}

.smenu{display:none!important}
@media (min-width:1180px){.shell:not(.mini) .side>.smenu{display:block!important}}

.admreq .arr{display:flex;align-items:center;gap:8px}.admreq .arr span{flex:1;min-width:0}.admreq .arr small{color:var(--mute);display:block}.admreq em{color:#ffb38a;font-style:normal}
