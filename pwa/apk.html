<script>
(function(){
  var ua = navigator.userAgent || '', url = location.href;
  // 아이폰은 앱 설치 대신 홈 화면 추가 안내로
  if (/iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) { location.replace('app.html'); return; }

  if (/Android/i.test(ua) && /NAVER|Instagram|FBAN|FBAV|Line\//i.test(ua)) { location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end'; return; }
